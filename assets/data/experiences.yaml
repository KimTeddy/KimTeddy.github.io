# ==============================================================================
# 경험 및 수상 데이터 파일 (experiences.yaml)
# 이 파일은 웹사이트에서 경험 및 수상 내역 데이터를 동적으로 로드하는 데 사용됩니다.
#
# 각 항목은 다음과 같은 구조를 따라야 합니다:
# ------------------------------------------------------------------------------
# - year: "연도"                  # 내역의 연도 (필수)
#   items:                        # 경험/대회 목록 (필수)
#     - title: "경험/대회명"      # 경험 또는 대회의 이름 (필수)
#       date: "기간/날짜"         # 기간 또는 날짜 (선택, 예: '2024.05 ~ 2024.11' 또는 '24.01.24')
#       description: "상세 내용"  # 어떤 내용으로 수상/참여했는지 설명 (선택)
#       organization: "수여 기관" # 상을 수여하거나 주최한 기관명 (선택)
#       badges:                   # 내역 목록 (선택)
#         - label: "종류"         # 종류 (예: 대상, 금상, 인턴, 기록, 참가 등)
#           count: 횟수           # 동일한 항목의 횟수 (선택, 1 이상의 정수)
# ------------------------------------------------------------------------------
# 예시:
# ------------------------------------------------------------------------------
# experiences:
#   - year: "2024년도"
#     items:
#       - title: "2024 한이음 ICT멘토링 공모전"
#         badges:
#           - label: "입선"
#             count: 2
#       - title: "2024 SEP 융합 Festival"
#         badges:
#           - label: "동상"
#             count: 1
#       - title: "제 3회 교내 창의적SW프로그램 경진대회"
#         badges:
#           - label: "대상"
#             count: 1
# ------------------------------------------------------------------------------
# 필수 항목만 포함된 최소 예시:
# ------------------------------------------------------------------------------
# experiences:
#   - year: "연도"
#     items:
#       - title: "대회명"
#         badges:
#           - label: "상 종류"
# ------------------------------------------------------------------------------
# 주의사항:
# 1. YAML 파일은 들여쓰기와 공백에 민감합니다. 각 항목은 2칸 들여쓰기를 유지하세요.
# 2. 필수 항목 (`year`, `competitions`, `name`, `awards`, `type`)은 반드시 포함되어야 합니다.
# 3. 선택 항목 (`count`)은 생략할 수 있으며, 기본적으로 1로 간주됩니다.
# ==============================================================================

