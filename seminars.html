<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/animations.js"></script>
  <script src="assets/js/artistic.js"></script>
<script>
(function(){
  function load(){
    fetch('assets/data/seminars.yaml').then(function(r){return r.text()}).then(function(t){
      var data=jsyaml.load(t);
      var container=document.getElementById('seminars-container');
      container.innerHTML='';
      if(!data.seminars) return;
      data.seminars.forEach(function(s){
        var card=document.createElement('div');
        card.className='card seminar-card';
        card.setAttribute('data-animate','fade-up');
        var html='';
        if(s.image) html+='<img src="'+s.image+'" alt="'+s.title+'" class="seminar-card__image">';
        html+='<h3 class="seminar-card__title">'+s.title+'</h3>';
        html+='<p class="seminar-card__desc">'+s.description+'</p>';
        html+='<div class="seminar-card__meta">';
        html+='<span>👤 '+s.organizer+'</span>';
        if(s.headcount) html+='<span>🎓 '+s.headcount+'명</span>';
        html+='<span>📅 '+s.period+'</span>';
        html+='</div>';
        if(s.link) html+='<a href="'+s.link+'" target="_blank" class="btn btn--ghost" style="margin-top:var(--space-3);font-size:var(--text-xs);padding:var(--space-2) var(--space-4)">GitHub →</a>';
        card.innerHTML=html;
        container.appendChild(card);
      });
    }).catch(function(){
      document.getElementById('seminars-container').innerHTML='<p class="loading-text">세미나 데이터를 불러오지 못했습니다.</p>';
    });
  }
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',load):load();
})();
</script>
